<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Office - 가상 AI 오피스</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
    </style>
    <!-- Markdown + syntax highlighting + XSS protection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo pixel-border">
                <span class="logo-icon">&#9632;&#9632;&#9632;</span>
                <span class="logo-text">AI OFFICE</span>
            </div>
            <span class="header-subtitle">나만의 세컨브레인 오피스 · 직원 <span class="agent-count">7</span>명</span>
            <span class="api-badge" id="apiBadge" title="OpenAI API 상태">API 확인 중...</span>
        </div>
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="office">
                <span class="tab-icon">&#9820;</span> 사무실
            </button>
            <button class="nav-tab" data-tab="chat">
                <span class="tab-icon">&#9993;</span> 팀 채팅
            </button>
            <button class="nav-tab" data-tab="brain">
                <span class="tab-icon">&#9998;</span> 세컨브레인
            </button>
            <button class="nav-tab" data-tab="org">
                <span class="tab-icon">&#9733;</span> 조직도
            </button>
            <button class="nav-tab" data-tab="customize">
                <span class="tab-icon">&#9998;</span> 사무실 편집
            </button>
        </nav>
        <div class="header-right">
            <div class="status-indicator">
                <span class="status-dot online"></span>
                <span>직원 <span class="agent-count">7</span>명 근무 중</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- ===== OFFICE VIEW ===== -->
        <section id="tab-office" class="tab-content active">
            <div class="office-container">
                <div class="office-grid" id="officeGrid">
                    <!-- Rooms will be rendered here -->
                </div>
                <!-- Agent Info Panel -->
                <div class="agent-info-panel" id="agentInfoPanel">
                    <div class="panel-header">
                        <h3>직원 정보</h3>
                        <button class="close-btn" id="closePanel">&times;</button>
                    </div>
                    <div class="panel-body" id="panelBody">
                        <p class="panel-hint">캐릭터를 클릭하면 정보가 표시됩니다</p>
                    </div>
                </div>
            </div>
            <!-- Agent Status Bar -->
            <div class="agent-status-bar" id="agentStatusBar">
                <!-- Agent status cards -->
            </div>
        </section>

        <!-- ===== CHAT VIEW ===== -->
        <section id="tab-chat" class="tab-content">
            <div class="chat-container">
                <div class="chat-sidebar">
                    <h3 class="sidebar-title">참여 에이전트</h3>
                    <div class="chat-agents" id="chatAgents">
                        <!-- Agent list -->
                    </div>
                </div>
                <div class="chat-main">
                    <div class="chat-header-bar">
                        <span class="chat-room-name"># 전체 채널</span>
                        <span class="chat-room-desc">지시를 남기면 담당 직원이 처리합니다</span>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <!-- Messages -->
                    </div>
                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <textarea id="chatInput" placeholder="/기록 오늘 결제 모듈 타임아웃 원인 찾아서 배포함 (Shift+Enter 줄바꿈)" class="chat-input" rows="2"></textarea>
                            <button id="sendBtn" class="send-btn">
                                <span>&#9654;</span>
                            </button>
                        </div>
                        <div id="mentionDropdown" class="mention-dropdown"></div>
                        <p class="chat-hint">⌨️ /기록 · /회의 · /찾기 · /주간 · /성과 · /비서 &nbsp;|&nbsp; 🛎️ 명령 없이 보내면 접수 매니저가 담당자에게 배정</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== SECOND BRAIN VIEW ===== -->
        <section id="tab-brain" class="tab-content">
            <div class="brain-container">
                <div class="brain-toolbar">
                    <input type="search" id="brainSearch" class="brain-input" placeholder="제목·내용·태그 필터">
                    <select id="brainCategory" class="brain-input"><option value="">전체 분류</option></select>
                    <select id="brainKind" class="brain-input">
                        <option value="">기록 + 회의</option>
                        <option value="log">업무 기록</option>
                        <option value="meeting">회의록</option>
                    </select>
                    <div class="brain-actions">
                        <button class="brain-btn" data-command="/주간">📊 이번 주 보고</button>
                        <button class="brain-btn" data-command="/주간 지난주">📊 지난주 보고</button>
                        <button class="brain-btn" data-command="/성과 올해">🧭 올해 성과 정리</button>
                    </div>
                </div>
                <div class="brain-stats" id="brainStats"></div>
                <div class="brain-list" id="brainList"></div>
            </div>
        </section>

        <!-- ===== ORG CHART VIEW ===== -->
        <section id="tab-org" class="tab-content">
            <div class="org-container">
                <h2 class="org-title">AI Office Org Chart</h2>
                <p class="org-subtitle">대표 → 접수 매니저 → 팀 · 새 팀은 agents/roster.py에 추가</p>
                <div class="org-chart" id="orgChart">
                    <!-- Org chart rendered by JS -->
                </div>
            </div>
        </section>

        <!-- ===== CUSTOMIZE VIEW ===== -->
        <section id="tab-customize" class="tab-content">
            <div class="customize-container">
                <div class="customize-toolbar">
                    <h3>도구모음</h3>
                    <div class="furniture-categories" id="furnitureCategories">
                        <!-- Categories -->
                    </div>
                    <div class="furniture-items" id="furnitureItems">
                        <!-- Items -->
                    </div>
                </div>
                <div class="customize-preview">
                    <div class="preview-header">
                        <span class="pixel-badge">&#9998; 사무실 편집</span>
                        <button class="save-btn" id="saveOffice">저장하기</button>
                    </div>
                    <div class="customize-grid" id="customizeGrid">
                        <!-- Editable office grid -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
